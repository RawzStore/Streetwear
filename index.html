<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAWZ Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- En-tête avec Logo centré -->
  <header class="header">
    <div class="logo-container">
      <img src="images/logo.png" alt="RAWZ" class="logo-img">
    </div>
    <div class="top-bar">
      <input type="text" id="search-input" placeholder="Rechercher...">
      <button id="theme-toggle-btn" class="theme-btn">🌙</button>
      <button id="cart-toggle-btn" class="cart-btn">
        Panier <span id="cart-badge">0</span>
      </button>
    </div>
  </header>

  <!-- Filtres & Tri -->
  <section class="controls">
    <div class="filters">
      <button class="filter-btn active" data-category="all">Tous</button>
      <button class="filter-btn" data-category="chemise">Chemise</button>
      <button class="filter-btn" data-category="polo">Polo</button>
      <button class="filter-btn" data-category="tshirts">T-shirts</button>
    </div>
    <div class="sort-container">
      <select id="sort-select">
        <option value="default">Trier par...</option>
        <option value="price-asc">Prix croissant</option>
        <option value="price-desc">Prix décroissant</option>
      </select>
    </div>
  </section>

  <!-- Grille Produits -->
  <main class="product-grid" id="product-grid"></main>

  <!-- Panier Latéral -->
  <div id="cart-overlay" class="cart-overlay"></div>
  <aside id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
      <h2>Mon Panier</h2>
      <button id="close-cart-btn" class="close-btn">&times;</button>
    </div>
    
    <div id="cart-items" class="cart-items"></div>

    <div class="cart-footer">
      <div class="promo-section">
        <input type="text" id="promo-input" placeholder="CODE PROMO">
        <button id="apply-promo-btn">Appliquer</button>
      </div>
      <p id="promo-msg" class="promo-message"></p>
      
      <div class="total-row">
        <span>Total :</span>
        <strong id="cart-total-price">0.00 €</strong>
      </div>

      <button onclick="sendOrderEmail()" class="checkout-btn">Commander maintenant</button>
    </div>
  </aside>

  <!-- Modale Formulaire de Livraison -->
  <div id="checkout-modal" class="modal">
    <div class="modal-content">
      <span id="close-checkout-btn" class="close-btn">&times;</span>
      <h2>Informations de livraison</h2>
      <form id="checkout-form">
        <div class="form-group">
          <label for="client-nom">Nom</label>
          <input type="text" id="client-nom" required>
        </div>
        <div class="form-group">
          <label for="client-prenom">Prénom</label>
          <input type="text" id="client-prenom" required>
        </div>
        <div class="form-group">
          <label for="client-email">E-mail</label>
          <input type="email" id="client-email" required>
        </div>
        <div class="form-group">
          <label for="client-tel">Téléphone</label>
          <input type="tel" id="client-tel" required>
        </div>
        <div class="form-group">
          <label for="client-adresse">Adresse postale</label>
          <input type="text" id="client-adresse" required>
        </div>
        <div class="form-group">
          <label for="client-ville">Ville et Code Postal</label>
          <input type="text" id="client-ville" required>
        </div>
        <button type="submit" class="submit-order-btn">Valider et envoyer la commande</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
